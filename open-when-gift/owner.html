<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>OPEN WHEN… owner</title>
<style>
:root{--paper:#EFECE4;--paper-soft:#E7E2D8;--paper-light:#F4F0E8;--green:#3F4745;--ink:#24211F;--muted:#625B54;--line:#B8AEA2;--sage:#6F7E62;--warn:#8A3B2E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper-soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.16em;font-size:26px;text-align:center;margin:12px 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;margin:0 0 16px}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:22px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:17px;background:var(--paper-light);color:var(--ink)}
button{height:50px;border-radius:14px;border:1px solid var(--green);background:var(--green);color:#f5f1e9;font-size:16px;padding:0 18px;cursor:pointer;-webkit-text-fill-color:#f5f1e9}
button.quiet{background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);border-color:var(--line)}
button.danger{background:transparent;color:var(--warn);-webkit-text-fill-color:var(--warn);border-color:var(--warn);height:40px;font-size:14px}
button:disabled{opacity:.55}
.row{display:flex;gap:10px;margin-top:12px}
.row > *{flex:1}
.msg{font-size:15px;margin:10px 0 0;min-height:1em}
.msg.bad{color:var(--warn)}
.link-out{display:none;margin-top:14px}
.link-out.show{display:block}
.link-box{word-break:break-all;font-size:14px;background:var(--paper-light);border:1px dashed var(--line);border-radius:12px;padding:12px;user-select:all;-webkit-user-select:all}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0;padding-top:0}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ref{font-weight:600;word-break:break-word}
.pill{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--line);white-space:nowrap}
.pill.unused{border-color:var(--sage);color:var(--sage)}
.pill.used{background:var(--green);border-color:var(--green);color:#f5f1e9}
.pill.revoked{border-color:var(--warn);color:var(--warn)}
.meta{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
.meta a{color:var(--ink)}
.hidden{display:none!important}
.empty{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OPEN WHEN…</h1>
  <p class="sub">Owner access links</p>

  <section class="card hidden" id="loginCard">
    <h2>Log in</h2>
    <form method="post" action="/api/admin/session">
      <label for="password">Owner password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit">Log in</button></div>
    </form>
    <p class="msg bad" id="loginMsg"></p>
  </section>

  <div class="hidden" id="ownerApp">
    <section class="card">
      <h2>Issue a one-use link</h2>
      <label for="reference">Order reference (optional)</label>
      <input id="reference" maxlength="40" autocomplete="off" placeholder="e.g. #1042" inputmode="text">
      <div class="row"><button type="button" id="issueBtn">Issue link</button></div>
      <p class="msg" id="issueMsg"></p>
      <div class="link-out" id="linkOut">
        <div class="link-box" id="linkBox"></div>
        <div class="row"><button type="button" id="copyBtn">Copy link</button></div>
        <p class="msg">This link is shown once. Send it to the customer after you have confirmed payment.</p>
      </div>
    </section>

    <section class="card">
      <div class="item-top"><h2 style="margin:0">History</h2><button type="button" class="quiet" id="refreshBtn" style="height:40px;font-size:14px;flex:0 0 auto">Refresh</button></div>
      <p class="msg" id="historyMsg"></p>
      <div id="history"></div>
    </section>

    <form method="post" action="/api/admin/session">
      <input type="hidden" name="action" value="logout">
      <div class="row"><button type="submit" class="quiet">Log out</button></div>
    </form>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var api = function(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Open-When-Owner': '1' }, opts.headers || {});
    opts.credentials = 'same-origin';
    opts.cache = 'no-store';
    return fetch(path, opts);
  };

  var loginNotes = { failed: 'That password did not work.', wait: 'Too many attempts. Please wait a few minutes and try again.', disabled: 'Owner login is disabled until the admin secret is at least 32 characters.' };
  var q = new URLSearchParams(location.search);
  if (q.get('login') && loginNotes[q.get('login')]) $('loginMsg').textContent = loginNotes[q.get('login')];
  if (location.search) history.replaceState(null, '', location.pathname);

  function fmt(iso){
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function renderHistory(links){
    var box = $('history'); box.textContent = '';
    if (!links.length) { box.appendChild(el('div', 'empty', 'No links issued yet.')); return; }
    links.forEach(function(link){
      var item = el('div', 'item');
      var top = el('div', 'item-top');
      top.appendChild(el('div', 'ref', link.reference || 'No reference'));
      var label = { unused:'Unused', used:'Used', revoked:'Revoked', saving:'Saving' }[link.status] || link.status;
      top.appendChild(el('span', 'pill ' + link.status, label));
      item.appendChild(top);
      var meta = el('div', 'meta');
      meta.appendChild(el('div', null, 'Issued ' + fmt(link.createdAt)));
      if (link.usedAt) meta.appendChild(el('div', null, 'Gift created ' + fmt(link.usedAt)));
      if (link.revokedAt) meta.appendChild(el('div', null, 'Revoked ' + fmt(link.revokedAt)));
      if (link.giftPath) {
        var a = el('a', null, 'Open recipient gift link');
        a.href = link.giftPath; a.target = '_blank'; a.rel = 'noopener noreferrer';
        var line = el('div'); line.appendChild(a); meta.appendChild(line);
      }
      item.appendChild(meta);
      if (link.status === 'unused') {
        var b = el('button', 'danger', 'Revoke');
        b.type = 'button';
        b.onclick = function(){
          if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to revoke'; return; }
          b.disabled = true;
          api('/api/admin/revoke', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ id: link.id }) })
            .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Could not revoke.'); }); })
            .then(loadHistory)
            .catch(function(e){ b.disabled = false; $('historyMsg').textContent = e.message; });
        };
        var row = el('div', 'row'); row.appendChild(b); item.appendChild(row);
      }
      $('history').appendChild(item);
    });
  }

  function loadHistory(){
    $('historyMsg').textContent = '';
    return api('/api/admin/history').then(function(r){
      if (r.status === 401 || r.status === 503) { showLogin(); return null; }
      return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Could not load history.'); return d; });
    }).then(function(d){ if (d) { showApp(); renderHistory(d.links || []); } })
      .catch(function(e){ showApp(); $('historyMsg').textContent = e.message; });
  }

  function showLogin(){ $('ownerApp').classList.add('hidden'); $('loginCard').classList.remove('hidden'); }
  function showApp(){ $('loginCard').classList.add('hidden'); $('ownerApp').classList.remove('hidden'); }

  $('issueBtn').onclick = function(){
    var btn = $('issueBtn'); btn.disabled = true;
    $('issueMsg').textContent = 'Issuing…'; $('linkOut').classList.remove('show');
    api('/api/admin/access', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ reference: $('reference').value }) })
      .then(function(r){
        if (r.status === 401) { showLogin(); throw new Error('Please log in again.'); }
        return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Could not issue a link.'); return d; });
      })
      .then(function(d){
        $('linkBox').textContent = location.origin + d.accessPath;
        $('linkOut').classList.add('show');
        $('issueMsg').textContent = d.reference ? 'Link issued for ' + d.reference + '.' : 'Link issued.';
        $('reference').value = '';
        $('copyBtn').textContent = 'Copy link';
        loadHistory();
      })
      .catch(function(e){ $('issueMsg').textContent = e.message; })
      .finally(function(){ btn.disabled = false; });
  };

  $('copyBtn').onclick = function(){
    var text = $('linkBox').textContent;
    var done = function(){ $('copyBtn').textContent = 'Copied'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback(){
      var range = document.createRange(); range.selectNodeContents($('linkBox'));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      try { if (document.execCommand('copy')) done(); else $('copyBtn').textContent = 'Selected: tap Copy'; } catch (e) { $('copyBtn').textContent = 'Selected: tap Copy'; }
    }
  };

  $('refreshBtn').onclick = loadHistory;
  loadHistory();
})();
</script>
</body>
</html>
