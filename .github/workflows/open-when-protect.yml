name: Protect OPEN WHEN

on:
  push:
    branches: [main]
    paths:
      - 'open-when-gift/**'
  pull_request:
    paths:
      - 'open-when-gift/**'

jobs:
  protected-behaviors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-when-gift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
